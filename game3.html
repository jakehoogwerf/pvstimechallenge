<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tickwick 3: Minute Monster Raid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --page:#0E2B2E; --moss:#17494D; --gold:#F2B632; --gold-dark:#B8860F; --ember:#E4572E; --mint:#3FBF8F; --mint-soft:#D8F5E9;
  --panel:#F3F7F2; --panel-2:#E1EBE4; --ink:#12292B; --muted:#4F6668; --line:#C5D6CC; --bad:#D9415A; --bad-soft:#FCE3E8; --help:#FFD23F;
  --title:#17494D; --tint:#2E7D4F;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --panel:#173A3D; --panel-2:#21494D; --ink:#EFF7F1; --muted:#B4CBC4; --line:#356066; --mint-soft:#1D5A47; --bad-soft:#4C2236; --title:#9FE8C8; --page:#081C1E; color-scheme:dark; }
}
:root[data-theme="dark"]{ --panel:#173A3D; --panel-2:#21494D; --ink:#EFF7F1; --muted:#B4CBC4; --line:#356066; --mint-soft:#1D5A47; --bad-soft:#4C2236; --title:#9FE8C8; --page:#081C1E; color-scheme:dark; }
*,*::before,*::after{box-sizing:inherit}
html{background:var(--page); scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0; min-height:100%}
body{background:var(--page); background-image:radial-gradient(ellipse at 50% -10%, #1F5A56 0%, transparent 60%); color:var(--ink); font-family:"Nunito","Trebuchet MS",Arial,sans-serif; font-size:18px; line-height:1.45}
.app{max-width:820px; margin:0 auto; padding:12px 14px 40px}
body.big .app{max-width:1280px}
h1,h2,h3,.display{font-family:"Lilita One","Arial Black",Arial,sans-serif; font-weight:400; letter-spacing:.3px; line-height:1.1; margin:0}
button,input{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:4px solid var(--gold); outline-offset:3px}

.hud{display:flex; align-items:center; justify-content:space-between; gap:8px; color:#EFF7F1; padding:2px 2px 10px; flex-wrap:wrap}
.brand{font-family:"Lilita One",Arial,sans-serif; font-size:21px; color:var(--gold)}
.pills{display:flex; gap:6px; align-items:center; flex-wrap:wrap}
.pill{display:flex; align-items:center; gap:6px; background:rgba(255,255,255,.12); padding:5px 12px; border-radius:999px; font-weight:900; font-size:16px; color:#EFF7F1; border:none; text-decoration:none}
.pill[hidden]{display:none}
.pill b{font-family:"Lilita One",Arial,sans-serif; font-weight:400; letter-spacing:3px; color:var(--gold); font-size:19px}

/* buttons */
.btn{border:none; border-radius:16px; padding:12px 22px; font-weight:900; font-size:19px; background:var(--gold); color:#2A1C00; box-shadow:0 5px 0 var(--gold-dark); transition:transform .08s}
.btn:active{transform:translateY(4px); box-shadow:0 1px 0 var(--gold-dark)}
.btn.ghost{background:var(--panel-2); color:var(--ink); box-shadow:0 5px 0 var(--line)}
.btn.small{padding:8px 14px; font-size:16px}
.btn:disabled{opacity:.5; cursor:not-allowed}
.row{display:flex; gap:10px; justify-content:flex-end; align-items:center; margin-top:16px; flex-wrap:wrap}

/* stage */
.stage{position:relative; border-radius:24px 24px 0 0; overflow:hidden; background:linear-gradient(180deg, #0B2226 0%, var(--tint) 130%); box-shadow:0 14px 34px rgba(0,0,0,.4); min-height:300px; transition:background .6s}
.stage .bg{position:absolute; inset:0; width:100%; height:100%}
.stage-top{position:relative; padding:14px 16px 0; color:#fff; z-index:2}
.bossname{font-family:"Lilita One",Arial,sans-serif; font-size:26px; text-shadow:0 2px 0 rgba(0,0,0,.35)}
.bossstep{font-weight:800; font-size:15px; opacity:.9}
.hp{position:relative; height:26px; background:rgba(0,0,0,.4); border-radius:999px; overflow:hidden; margin-top:8px; border:3px solid rgba(255,255,255,.85)}
.hp i{display:block; height:100%; width:100%; background:linear-gradient(90deg,#FF8A5C,var(--ember)); transition:width .9s cubic-bezier(.2,.9,.3,1)}
.hp span{position:absolute; inset:0; display:grid; place-items:center; font-weight:900; font-size:15px; color:#fff; text-shadow:0 1px 2px #000}
.meta{display:flex; justify-content:space-between; align-items:center; margin-top:6px; font-weight:900; font-size:15px; gap:10px}
.charge{display:flex; align-items:center; gap:5px}
.charge i{width:16px; height:16px; border-radius:50%; background:rgba(255,255,255,.25); border:2px solid rgba(255,255,255,.7)}
.charge i.on{background:var(--help); box-shadow:0 0 10px var(--help)}
.bosswrap{position:relative; z-index:1; display:grid; place-items:center; padding:4px 0 26px}
.bosswrap > div{width:min(52%, 300px)}
.bosswrap svg{width:100%; height:auto; display:block; filter:drop-shadow(0 10px 14px rgba(0,0,0,.35))}
body.big .bosswrap > div{width:min(46%, 380px)}
.bob{animation:bob 1.6s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-8px)}}
.hurt{animation:hurt .5s}
@keyframes hurt{0%,100%{transform:translateX(0); filter:none}20%{transform:translateX(-14px) rotate(-3deg); filter:brightness(2.2) saturate(.4)}50%{transform:translateX(12px) rotate(3deg)}80%{transform:translateX(-6px)}}
.dead{animation:dead 1.4s forwards}
@keyframes dead{40%{transform:rotate(-10deg) scale(1.05); filter:grayscale(.6)}100%{transform:translateY(60px) rotate(18deg) scale(.6); opacity:0; filter:grayscale(1)}}
.fled{animation:fled 1.3s forwards}
@keyframes fled{100%{transform:translateX(120%) rotate(8deg); opacity:.2}}
.glow{animation:glow 1.4s ease-in-out infinite alternate}
@keyframes glow{to{opacity:.4}}
.spin{transform-box:fill-box; transform-origin:center; animation:spin 5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.twinkle{animation:tw 1.8s ease-in-out infinite alternate}
@keyframes tw{to{opacity:.2}}
.fx{position:absolute; inset:0; z-index:3; pointer-events:none}
.banner{position:absolute; left:50%; top:46%; transform:translate(-50%,-50%) rotate(-4deg); font-family:"Lilita One",Arial,sans-serif; font-size:clamp(30px,7vw,54px); color:#fff; text-shadow:0 4px 0 #12292B, 0 0 24px rgba(242,182,50,.9); white-space:nowrap; animation:bannerIn 1.7s ease-out forwards; line-height:1}
@keyframes bannerIn{0%{opacity:0; transform:translate(-50%,-50%) scale(.3) rotate(-14deg)}18%{opacity:1; transform:translate(-50%,-50%) scale(1.12) rotate(-4deg)}80%{opacity:1}100%{opacity:0; transform:translate(-50%,-80%) scale(1) rotate(-4deg)}}
.dmg{position:absolute; left:50%; top:66%; font-family:"Lilita One",Arial,sans-serif; font-size:clamp(40px,9vw,72px); color:#FFE37A; text-shadow:0 4px 0 #7A1F0A; animation:dmgUp 1.5s ease-out forwards}
.dmg.blast{color:#9FF2FF; text-shadow:0 4px 0 #0E4A66}
@keyframes dmgUp{0%{opacity:0; transform:translate(-50%,0) scale(.4)}20%{opacity:1; transform:translate(-50%,-30px) scale(1.2)}100%{opacity:0; transform:translate(-50%,-130px) scale(1)}}
.timer{position:absolute; left:0; right:0; bottom:0; height:22px; background:rgba(0,0,0,.45); z-index:2}
.timer i{display:block; height:100%; width:100%; background:var(--gold); transition:width .25s linear}
.timer.low i{background:var(--ember)}
.timer span{position:absolute; inset:0; display:grid; place-items:center; color:#fff; font-weight:900; font-size:14px; text-shadow:0 0 3px #000, 0 1px 3px #000, 0 0 6px #000}
.codebox{position:relative; z-index:2; text-align:center; color:#fff; padding:26px 16px 30px}
.codebox p{margin:0; font-weight:800; font-size:18px}
.code{display:flex; justify-content:center; gap:10px; margin:12px 0}
.code span{font-family:"Lilita One",Arial,sans-serif; font-size:clamp(44px,11vw,84px); width:1.25em; padding:4px 0; border-radius:16px; background:#fff; color:var(--ink); box-shadow:0 6px 0 rgba(0,0,0,.35)}
body.big .code span{font-size:clamp(70px,12vw,150px)}

/* team */
.team{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; background:var(--moss); padding:10px}
body.big .team{grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:12px; padding:16px}
.chip{display:flex; align-items:center; gap:8px; background:rgba(255,255,255,.1); color:#fff; border:3px solid transparent; border-radius:14px; padding:5px 8px; font-weight:800; font-size:15px; text-align:left; min-width:0}
body.big .chip{font-size:22px; padding:8px 12px}
.chip svg.face{flex:0 0 32px; width:32px; height:32px; border-radius:9px}
body.big .chip svg.face{flex-basis:48px; width:48px; height:48px}
.chip .nm{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.chip .st{flex:0 0 auto; font-size:17px}
.chip.me{border-color:var(--gold)}
.chip.done{background:var(--mint); color:#062019}
.chip.help{background:var(--help); color:#2A1C00; animation:nudge 1s ease-in-out infinite alternate}
@keyframes nudge{to{transform:translateY(-3px)}}
.chip:disabled{cursor:default; opacity:1}
.dots::after{content:"…"; animation:glow 1s infinite alternate}

/* big screen (teacher's projector) */
body.big #main:has(#stage){display:grid; grid-template-columns:1.2fr 1fr; grid-template-areas:"stage panel" "team panel"; grid-template-rows:auto 1fr; column-gap:18px; align-items:start}
body.big #stage{grid-area:stage; border-radius:24px 24px 0 0}
body.big #team{grid-area:team; border-radius:0 0 24px 24px}
body.big #panel{grid-area:panel; border-radius:24px}
body.big .bosses{grid-template-columns:repeat(3,minmax(0,1fr))}
body.big .panel{font-size:26px; padding:28px}
body.big .big-msg{font-size:46px}
body.big .context, body.big .note{font-size:24px}
body.big .tips{font-size:30px}
body.big .sum .n{font-size:48px}
body.big .sum .t{font-size:28px}
body.big .bossname{font-size:40px}
body.big .bossstep, body.big .meta{font-size:22px}
body.big .hp{height:38px}
body.big .hp span{font-size:22px}
body.big .timer{height:32px}
body.big .timer span{font-size:20px}
body.big .bosscard .bn{font-size:20px}
body.big .bosscard .bs{font-size:16px}
body.big .codebox p{font-size:28px}
/* panel */
.panel{background:var(--panel); border-radius:0 0 24px 24px; padding:20px; box-shadow:0 14px 34px rgba(0,0,0,.3)}
.home .panel{border-radius:24px}
.qtop{display:flex; justify-content:space-between; gap:10px; color:var(--muted); font-size:16px; font-weight:800; margin-bottom:6px}
.prompt{font-size:24px; font-weight:900; margin:0 0 8px; line-height:1.5}
.tchip{font-family:"Lilita One",Arial,sans-serif; font-weight:400; font-size:26px; background:#12292B; color:#FFE9A8; padding:1px 12px; border-radius:10px; white-space:nowrap}
.context{color:var(--muted); font-size:17px; margin:0 0 10px}
.nl{overflow-x:auto; margin:2px 0 8px}
.nl svg{width:100%; min-width:380px; height:auto; display:block}
.count{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:0 0 10px; font-weight:900}
.count span{background:var(--panel-2); border-radius:10px; padding:3px 10px}
.options{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px}
.opt{border:3px solid var(--line); background:var(--panel-2); color:var(--ink); border-radius:18px; padding:14px 10px; font-weight:900; font-size:21px; min-height:64px; transition:transform .1s, border-color .1s}
.opt:hover:not(:disabled){border-color:var(--gold); transform:translateY(-2px)}
.opt.wrong{background:var(--bad-soft); border-color:var(--bad); opacity:.7; animation:shake .35s}
.opt.right{background:var(--mint-soft); border-color:var(--mint)}
.opt:disabled{cursor:default}
@keyframes shake{20%{transform:translateX(-7px)}60%{transform:translateX(7px)}}
.feedback{margin-top:12px; border-radius:16px; padding:12px 16px; font-size:18px; display:none}
.feedback.show{display:block}
.feedback.hint{background:var(--bad-soft); border:2px solid var(--bad)}
.feedback.good{background:var(--mint-soft); border:2px solid var(--mint)}
.big-msg{font-family:"Lilita One",Arial,sans-serif; font-size:30px; color:var(--title); margin:0 0 4px}
.sum{display:grid; grid-template-columns:auto 1fr; gap:6px 16px; align-items:center; margin:10px 0}
.sum .n{font-family:"Lilita One",Arial,sans-serif; font-size:30px; color:var(--ember); text-align:right; white-space:nowrap}
.sum .t{font-weight:800}
.helplist{display:grid; gap:8px; margin-top:10px}
.helprow{display:flex; align-items:center; gap:10px; background:var(--panel-2); border-radius:14px; padding:6px 10px; font-weight:800}
.helprow svg{width:36px; height:36px; border-radius:10px; flex:0 0 36px}
.helprow .nm{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.helprow.asked{background:var(--help); color:#2A1C00}
.stars{font-size:44px; letter-spacing:6px; color:var(--gold); text-shadow:0 3px 0 var(--gold-dark); line-height:1}
.stars .off{color:var(--line); text-shadow:none}

/* monster picker */
.bosses{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px; margin-top:12px}
.bosscard{border:4px solid var(--line); background:var(--panel-2); color:var(--ink); border-radius:18px; padding:8px 6px 10px; text-align:center; min-width:0}
.bosscard svg{width:100%; height:auto; display:block}
.bosscard .bn{font-family:"Lilita One",Arial,sans-serif; font-size:15px; line-height:1.1; display:block; margin-top:4px}
.bosscard .bs{font-size:12.5px; font-weight:800; color:var(--muted); display:block; margin-top:3px; line-height:1.2}
.bosscard .bstar{display:block; color:var(--gold-dark); font-size:15px; letter-spacing:2px; min-height:1.3em}
.bosscard[aria-pressed="true"]{border-color:var(--gold); background:var(--panel); transform:translateY(-3px)}
.bosscard:disabled{cursor:default; opacity:.85}

/* home */
.lineup{display:flex; justify-content:center; align-items:flex-end; gap:0; padding:18px 8px 0}
.lineup svg{width:19%; max-width:150px; height:auto; margin:0 -1%}
.lineup svg:nth-child(odd){animation:bob 1.8s ease-in-out infinite alternate}
.lineup svg:nth-child(even){animation:bob 1.5s ease-in-out .4s infinite alternate}
.avatars{display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:10px; margin:8px 0 4px}
.av{border:4px solid transparent; background:var(--panel-2); border-radius:20px; padding:4px}
.av svg{width:100%; height:auto; display:block; border-radius:14px}
.av[aria-pressed="true"]{border-color:var(--gold); transform:translateY(-3px)}
.field{display:flex; flex-direction:column; gap:6px; margin-top:12px; font-weight:900}
.field input{font-size:21px; padding:10px 14px; border-radius:14px; border:3px solid var(--line); background:var(--panel-2); color:var(--ink); font-weight:800}
.two{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:16px}
.box{background:var(--panel-2); border-radius:18px; padding:14px}
.box h3{font-size:21px; margin-bottom:4px}
.box p{margin:0 0 10px; color:var(--muted); font-size:16px}
.codein{display:flex; gap:8px}
.codein input{flex:1; min-width:0; text-transform:uppercase; letter-spacing:6px; text-align:center; font-family:"Lilita One",Arial,sans-serif; font-size:26px; padding:6px; border-radius:14px; border:3px solid var(--line); background:var(--panel); color:var(--ink)}
.err{color:var(--bad); font-weight:900; min-height:1.4em; margin-top:10px}
.howto{margin:14px 0 0; padding-left:22px}
.howto li{margin:4px 0}
.linkbtn{background:none; border:none; color:var(--muted); font-weight:800; text-decoration:underline; padding:4px; font-size:15px}
.note{color:var(--muted); font-size:15px; margin:8px 0 0}
.net{position:fixed; left:50%; bottom:14px; transform:translateX(-50%); background:#12292B; color:#fff; padding:8px 16px; border-radius:999px; font-weight:800; font-size:15px; z-index:40}
.net[hidden]{display:none}

/* coach sheet */
.modal{position:fixed; inset:0; background:rgba(6,20,22,.72); z-index:30; display:grid; place-items:center; padding:16px; overflow:auto}
.modal[hidden]{display:none}
.sheet{background:var(--panel); border-radius:24px; padding:22px; max-width:640px; width:100%; border:4px solid var(--help)}
.tips{margin:8px 0 0; padding-left:24px; font-weight:800}
.tips li{margin:6px 0}

.confetti{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:20}
.confetti i{position:absolute; width:10px; height:14px; border-radius:2px; animation:fall 1.4s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg); opacity:.7}}

@media (max-width:640px){
  body{font-size:17px}
  .options{grid-template-columns:1fr}
  .bosses{grid-template-columns:repeat(2,minmax(0,1fr))}
  .avatars{grid-template-columns:repeat(3,minmax(0,1fr))}
  .two{grid-template-columns:1fr}
  .prompt{font-size:21px}
  .tchip{font-size:22px}
  .bossname{font-size:21px}
}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important; transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="hud">
    <div class="brand">Tickwick 3: Monster Raid</div>
    <div class="pills">
      <span class="pill" id="codePill" hidden>Team code <b id="codeTxt"></b></span>
      <button class="pill" id="sound" aria-label="Sound on or off"></button>
      <button class="pill" id="leave" hidden>Leave team</button>
      <a class="pill" id="menu" href="index.html">All games</a>
    </div>
  </div>
  <div id="main"></div>
</div>
<div class="modal" id="coach" hidden></div>
<div class="net" id="net" hidden>Reconnecting…</div>
<div class="confetti" id="confetti" aria-hidden="true"></div>

<script>
/* ================= setup ================= */
const SUPABASE_URL = "https://awxmgiindzlwtgoxtxdt.supabase.co";
const SUPABASE_KEY = "sb_publishable_9YTsc1bf-_IZKj-KdmQVfg_uOhr997p";
const GAME_NO = 3, MAX_ROUNDS = 12;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const norm = (t) => ((t % 720) + 720) % 720;
const hourOf = (t) => Math.floor(norm(t) / 60) || 12;
const fmt = (t) => hourOf(t) + ":" + String(norm(t) % 60).padStart(2, "0");
function dur(d) { const h = Math.floor(d / 60), m = d % 60, out = []; if (h) out.push(h + " hour" + (h > 1 ? "s" : "")); if (m || !h) out.push(m + " minute" + (m === 1 ? "" : "s")); return out.join(" "); }
function shortDur(d) { const h = Math.floor(d / 60), m = d % 60; return ((h ? h + " h " : "") + (m || !h ? m + " min" : "")).trim(); }

const SAVE_KEY = "tickwick3-save-v1";
let save = { name: "", hero: "fox", sound: true, code: "", key: "", role: "" };
try { Object.assign(save, JSON.parse(localStorage.getItem(SAVE_KEY) || "{}")); } catch (e) {}
const persist = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} };

/* ================= sound ================= */
let actx = null;
function tone(freq, d = 0.15, type = "sine", when = 0, vol = 0.07) {
  if (!save.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain(), t0 = actx.currentTime + when;
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0 + d + 0.02);
  } catch (e) {}
}
const SFX = {
  right: () => { tone(660, .12, "triangle"); tone(990, .2, "triangle", .1); },
  wrong: () => { tone(220, .22, "square", 0, .035); tone(180, .25, "square", .12, .035); },
  hit: () => { tone(150, .2, "sawtooth", 0, .07); tone(95, .32, "sawtooth", .08, .06); },
  combo: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .16, "triangle", i * .08)),
  blast: () => [1047, 784, 1319, 1568].forEach((f, i) => tone(f, .25, "sine", i * .1, .06)),
  win: () => [523, 659, 784, 659, 784, 1047].forEach((f, i) => tone(f, .22, "triangle", i * .13)),
  start: () => { tone(392, .2, "triangle"); tone(523, .2, "triangle", .15); tone(784, .35, "triangle", .3); },
  click: () => tone(520, .05, "sine", 0, .04),
};
function drawSound() { $("sound").textContent = save.sound ? "🔊" : "🔇"; $("sound").setAttribute("aria-pressed", save.sound ? "true" : "false"); }

    cands.push(dur(d - 60), dur(d + 60), dur(d + 10), dur(d - 10));
    line = { stops: [fmt(a), fmt(a + to), fmt(a + to + 60 * H), fmt(b)], jumps: ["+" + to + " min", "+" + H + " h", "+" + m2 + " min"], max: 3 };
    hint = "Three jumps: to " + fmt(a + to) + ", the whole hours to " + fmt(a + to + 60 * H) + ", then on to " + fmt(b) + ". Add the minutes, and swap 60 minutes for 1 hour.";
  } else {
    const h = ri(1, 9), m1 = ri(21, 56), to = 60 - m1, rest = ri(4, 50), extra = r() < 0.3 ? 60 : 0;
    d = to + rest + extra; a = h * 60 + m1; b = a + d; answer = fmt(b);
    cands = [hourOf(a) + Math.floor(d / 60) + ":" + String(m1 + (d % 60)).padStart(2, "0"), fmt(b + 60), fmt(b - 60), fmt(b + 10), fmt(b - 10), fmt(b + 5)];
    line = { stops: [fmt(a), fmt(a + to), "?"], jumps: ["+" + to + " min", "+" + shortDur(d - to)], max: 2 };
    hint = "Jump to " + fmt(a + to) + " first: that uses " + to + " minutes. Then add the " + shortDur(d - to) + " that are left.";
    prompt = `A battle starts at <span class="tchip">${fmt(a)}</span> and lasts <b>${dur(d)}</b>. What time does it end?`;
  }
  const opts = [answer];
  for (const c of cands) { if (opts.length >= 4) break; if (!opts.includes(c)) opts.push(c); }
  for (let k = 15; opts.length < 4; k += 5) { const c = kind === 5 ? fmt(b + k) : dur(d + k); if (!opts.includes(c)) opts.push(c); }
  for (let i = opts.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [opts[i], opts[j]] = [opts[j], opts[i]]; }
  prompt = prompt || `How long from <span class="tchip">${fmt(a)}</span> to <span class="tchip">${fmt(b)}</span>?`;
  const plain = kind === 5 ? "A battle starts at " + fmt(a) + " and lasts " + dur(d) + ". What time does it end?" : "How long from " + fmt(a) + " to " + fmt(b) + "?";
  return { kind, fine, prompt, plain, answer, options: opts, line, hint, count };
}

/* ================= talking to the game server ================= */
async function rpc(fn, args) {
  const res = await fetch(SUPABASE_URL + "/rest/v1/rpc/" + fn, { method: "POST", headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" }, body: JSON.stringify(args) });
  if (!res.ok) throw new Error(fn + " " + res.status);
  return res.json();
}
function logAnswer(q, given, ok) {
  try {
    const row = { game: GAME_NO, chapter: "boss" + S.st.boss, player: (save.name.trim() || "(no name)").slice(0, 20), skill: SKILLS[q.kind], question: q.plain.slice(0, 300), correct_answer: q.answer.slice(0, 60), given_answer: String(given).slice(0, 60), is_correct: !!ok };
    fetch(SUPABASE_URL + "/rest/v1/answer_log", { method: "POST", keepalive: true, headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json", Prefer: "return=minimal" }, body: JSON.stringify(row) }).catch(() => {});
  } catch (e) {}
}

/* ================= state ================= */
const S = { st: null, key: "", seq: 0, applied: 0, timer: null, fails: 0, leftAt: 0, my: null, q: null, pickBoss: 0, canStart: null, coachSlot: null, hits: 0 };
const isHost = () => save.role === "host";
const me = () => S.st && S.st.players.find((p) => p.slot === S.st.you);
const leader = (st) => st.players.length ? st.players.reduce((a, b) => (a.slot < b.slot ? a : b)) : null;
const canStart = (st) => st.host || (!st.hosted && st.you != null && leader(st) && leader(st).slot === st.you);

function enter(r, role) {
  save.code = r.code; save.key = r.key; save.role = role; persist(); S.hits = 0; S.my = null;
  SFX.start(); room(); apply(r.state, ++S.seq); startPolling();
}
async function leaveRoom(msg = "") {
  const { code, key, role } = save; stopPolling();
  save.code = ""; save.key = ""; save.role = ""; persist();
  if (code && key && role === "player") rpc("raid_leave", { p_code: code, p_key: key }).catch(() => {});

}
$("leave").onclick = () => leaveRoom();

/* ================= room ================= */
function room() {
  document.body.classList.toggle("big", isHost());
  $("codePill").hidden = false; $("codeTxt").textContent = save.code; $("leave").hidden = false; $("leave").textContent = isHost() ? "Close room" : "Leave team";
  $("main").innerHTML = `<div class="stage" id="stage"></div><div class="team" id="team" aria-label="Team"></div><div class="panel" id="panel"></div>`;
  S.teamSig = ""; S.waitSig = ""; S.key = ""; S.canStart = null; S.pickBoss = 0; S.st = null;
}
function startPolling() { stopPolling(); const loop = async () => { await poll(); if (save.code) S.timer = setTimeout(loop, (S.st && (S.st.phase === "question" || S.st.phase === "result") ? 1000 : 2000) + Math.random() * 300); }; S.timer = setTimeout(loop, 800); S.tick = setInterval(drawTimer, 200); }
function stopPolling() { clearTimeout(S.timer); clearInterval(S.tick); S.timer = null; $("net").hidden = true; }
async function poll() {
  const seq = ++S.seq;
  try { const st = await rpc("raid_state", { p_code: save.code, p_key: save.key }); S.fails = 0; $("net").hidden = true; apply(st, seq); }
  catch (e) { if (++S.fails >= 3) $("net").hidden = false; }
}
function apply(st, seq) {
  if (!save.code || seq < S.applied) return; S.applied = seq;
  if (!st || !st.ok) return leaveRoom("That team has finished. Start a new one or join another.");
  if (save.role === "player" && st.you == null) return leaveRoom("You’re no longer in that team. Join again with the code.");
  const prev = S.st; S.st = st; S.leftAt = performance.now();
  const key = st.phase + ":" + st.boss + ":" + st.round + ":" + st.seed;
  if (key !== S.key) { S.key = key; onPhase(st, prev); }
  live(st);
}

function onPhase(st, prev) {
  closeCoach();
  if (st.phase === "lobby") { stageLobby(st); S.canStart = null; }
  else {
    if (!$("bossWrap") || !prev || prev.boss !== st.boss || prev.phase === "lobby" || (prev.phase === "over" && st.phase === "question")) stageBattle(st);
    if (st.phase === "question") {
      const m = me(); S.my = { done: !!(m && m.done), resumed: !!(m && m.done), first: true, tries: 0, level: 0, help: false };
      S.q = st.you != null ? makeQuestion(st, st.you) : null;
      if (isHost() || st.you == null) panelWatch(st); else if (S.my.done) panelWaiting(st); else panelQuestion(st);
      if (st.round === 1) SFX.start();
    } else if (st.phase === "result") { playResult(st.last, S.key); panelResult(st); }
    else if (st.phase === "over") { playResult(st.last, S.key, true); S.canStart = null; }
  }
}

}

function banner(text) { const fx = $("fx"); if (!fx) return; const b = document.createElement("div"); b.className = "banner"; b.textContent = text; fx.appendChild(b); setTimeout(() => b.remove(), 1800); }
function floatDmg(text, blast) { const fx = $("fx"); if (!fx) return; const d = document.createElement("div"); d.className = "dmg" + (blast ? " blast" : ""); d.textContent = text; fx.appendChild(d); setTimeout(() => d.remove(), 1600); }
function hurt() { const b = $("bossBob"); if (!b) return; b.classList.remove("hurt"); void b.offsetWidth; b.classList.add("hurt"); }
function playResult(L, key, over) {
  if (!L) return; const alive = () => S.key === key;
  const perfect = L.n1 === L.total && L.n1 > 0;
  banner(perfect ? (L.total > 1 ? "PERFECT TEAM!" : "PERFECT HIT!") : L.mult > 1 ? "TEAM COMBO!" : L.dmg > 0 ? "Team attack!" : "The monster dodged!");
  if (perfect || L.mult > 1) SFX.combo();
  if (L.dmg > 0) setTimeout(() => { if (!alive()) return; hurt(); SFX.hit(); floatDmg("−" + L.dmg); }, 600);
  if (L.blast > 0) setTimeout(() => { if (!alive()) return; banner("TIME BLAST!"); SFX.blast(); hurt(); floatDmg("−" + L.blast, true); }, 2300);
  if (over) setTimeout(() => {
    if (!alive()) return; const b = $("bossBob"); if (!b) return; b.classList.remove("bob", "hurt");
    if (L.stars > 0) { b.classList.add("dead"); SFX.win(); confetti(90); banner("MONSTER DEFEATED!"); } else { b.classList.add("fled"); banner("It ran away!"); }
  }, L.blast > 0 ? 4000 : 1900);
}
function drawTimer() {
  const st = S.st, bar = $("timerBar"); if (!st || !bar) return;
  const total = [0, 45, 45, 60, 75, 75][st.boss];
  if (st.phase !== "question" || st.left == null) { bar.style.width = "0%"; $("timerTxt").textContent = st.phase === "result" ? "Next round coming…" : ""; $("timer").classList.remove("low"); return; }
  const left = Math.max(0, st.left - (performance.now() - S.leftAt) / 1000);
  bar.style.width = Math.min(100, left / total * 100) + "%"; $("timer").classList.toggle("low", left <= 10);
  $("timerTxt").textContent = Math.ceil(left) + " seconds";
}

/* ---------- things that update every second ---------- */
function live(st) {
  if (st.phase === "lobby") {
    const n = st.players.length; if ($("lobbyCount")) $("lobbyCount").textContent = n === 0 ? "Waiting for heroes to join…" : n + (n === 1 ? " hero has" : " heroes have") + " joined";
  } else if ($("hpBar")) {
    $("hpBar").style.width = (st.max ? st.hp / st.max * 100 : 0) + "%"; $("hpText").textContent = st.hp + " / " + st.max;
    $("roundTxt").textContent = "Round " + st.round + " of " + MAX_ROUNDS;
    document.querySelectorAll(".charge i").forEach((el, i) => el.classList.toggle("on", i < st.charge));
  }
  drawTeam(st); drawTimer();
  const cs = canStart(st);
  if ((st.phase === "lobby" || st.phase === "over") && cs !== S.canStart) { S.canStart = cs; st.phase === "lobby" ? panelLobby(st) : panelOver(st); }
  if (st.phase === "lobby" || st.phase === "over") updatePicker(st);
  if (st.phase === "question") {
    if (isHost() || st.you == null) { const el = $("watchCount"); if (el) { const d = st.players.filter((p) => p.done).length; el.textContent = d + " of " + st.players.length + " heroes locked in"; } }
    else if (S.my && S.my.done) drawWaiting(st);
    if (S.coachSlot != null) { const p = st.players.find((x) => x.slot === S.coachSlot); if (!p || p.done) closeCoach(); }
  }
}
function drawTeam(st) {

    const canHelp = inRound && !mine && !p.done && iAmDone;

/* ---------- question ---------- */
function lineHTML(q, level) { return `<div class="nl">${numberLine(q.line.stops, q.line.jumps, Math.min(level, q.line.max))}</div>`; }
function panelQuestion(st) {
  const q = S.q, hideLine = st.boss === 5;
  $("panel").innerHTML = `<div class="qtop"><span>${esc(BOSSES[st.boss].step)}</span><span>Round ${st.round}</span></div>
    <p class="prompt">${q.prompt}</p><div id="lineBox">${hideLine ? `<button class="btn ghost small" id="showLine" style="margin-bottom:10px">Show a number line</button>` : lineHTML(q, 0)}</div><div id="countBox"></div>
    <div class="options">${q.options.map((o) => `<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div>
    <div id="fb" class="feedback" aria-live="polite"></div>
    <div class="row" style="justify-content:space-between"><button class="btn ghost small" id="helpBtn">✋ Ask my team for help</button><span class="note" style="margin:0">First try = full power</span></div>`;
  if ($("showLine")) $("showLine").onclick = () => { $("lineBox").innerHTML = lineHTML(q, S.my.level); };
  $("helpBtn").onclick = async () => {
    S.my.help = !S.my.help; $("helpBtn").textContent = S.my.help ? "✋ Help is on the way. Tap to cancel" : "✋ Ask my team for help"; SFX.click();
    try { const seq = ++S.seq; apply(await rpc("raid_help", { p_code: save.code, p_key: save.key, p_round: st.round, p_on: S.my.help }), seq); } catch (e) {}
  };
  document.querySelectorAll(".opt").forEach((b) => b.onclick = () => {

    }

}
async function sendAnswer(round, first, attempt) {
  try { const seq = ++S.seq; apply(await rpc("raid_answer", { p_code: save.code, p_key: save.key, p_round: round, p_first: first }), seq); }
  catch (e) { if (attempt < 4 && S.st && S.st.phase === "question" && S.st.round === round) setTimeout(() => sendAnswer(round, first, attempt + 1), 700); }

function panelWaiting(st) {

function drawWaiting(st) {

  const others = st.players.filter((p) => p.slot !== st.you && !p.done).sort((a, b) => (b.help ? 1 : 0) - (a.help ? 1 : 0));
  const sig = JSON.stringify(others); if (sig === S.waitSig && box.childElementCount) return; S.waitSig = sig;
  box.innerHTML = others.length
    ? `<p class="context" style="margin:10px 0 0">${others.length === 1 ? "1 teammate is" : others.length + " teammates are"} still working. Go and help: if everyone hits first time, the damage is doubled!</p>
       <div class="helplist">${others.map((p) => `<div class="helprow ${p.help ? "asked" : ""}">${heroSVG(p.hero)}<span class="nm">${esc(p.name)}${p.help ? " asked for help ✋" : ""}</span><button class="btn small" data-coach="${p.slot}">Help</button></div>`).join("")}</div>`
    : `<p class="context" style="margin:10px 0 0">Everyone is locked in. Team attack incoming!</p>`;
  box.querySelectorAll("[data-coach]").forEach((b) => b.onclick = () => openCoach(+b.dataset.coach));
}
function panelWatch(st) {
  const b = BOSSES[st.boss];
  $("panel").innerHTML = `<h2 class="big-msg">Round ${st.round}: heroes are working</h2><p class="context" id="watchCount"></p>
    <p style="font-weight:900; margin:10px 0 0">How to beat ${esc(b.name)}</p><ol class="tips">${b.how.map((h) => `<li>${esc(h)}</li>`).join("")}</ol>
    <p class="note">Finished early? Tap a teammate’s name on your own screen to help them. Everyone right first time doubles the damage.</p>`;
}

/* ---------- coaching a teammate ---------- */
function openCoach(slot) {
  const st = S.st, p = st.players.find((x) => x.slot === slot); if (!p || st.phase !== "question") return;
  const q = makeQuestion(st, slot); S.coachSlot = slot; SFX.click();
  $("coach").innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="Help ${esc(p.name)}"><h2 class="big-msg">Help ${esc(p.name)}</h2>
    <p class="context">This is ${esc(p.name)}’s question. Go and sit with them. Don’t say the answer: ask these coaching questions instead.</p>
    <p class="prompt">${q.prompt}</p>${lineHTML(q, 0)}<ol class="tips">${COACH[q.kind].map((t) => `<li>${esc(t)}</li>`).join("")}</ol>
    <div class="row"><button class="btn" id="coachClose">Back to the battle</button></div></div>`;
  $("coach").hidden = false; $("coachClose").onclick = closeCoach; $("coachClose").focus();
}
function closeCoach() { S.coachSlot = null; $("coach").hidden = true; $("coach").innerHTML = ""; }
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("coach").hidden) closeCoach(); });
$("coach").addEventListener("click", (e) => { if (e.target === $("coach")) closeCoach(); });

/* ---------- results ---------- */
function resultRows(L) {
  const perfect = L.n1 === L.total && L.n1 > 0, solo = L.total === 1;
  const rows = [[L.n1 + " of " + L.total, solo ? (L.n1 ? "You hit first time" : "No first-time hit") : (L.n1 === 1 ? "hero hit first time" : "heroes hit first time")]];
  if (L.n2) rows.push([String(L.n2), L.n2 === 1 ? "hero hit at half power" : "heroes hit at half power"]);
  rows.push(["×" + L.mult, perfect ? (solo ? "Perfect hit: double damage!" : "Perfect team: everyone hit first time, so double damage!") : L.mult > 1 ? "Team combo: half the team or more hit first time" : "No combo this round"]);
  rows.push(["−" + L.dmg, "damage to the monster"]);
  if (L.blast) rows.push(["−" + L.blast, "Time Blast! Three perfect rounds charged it up"]);
  return `<div class="sum">${rows.map(([n, t]) => `<span class="n">${esc(n)}</span><span class="t">${esc(t)}</span>`).join("")}</div>`;
}
function panelResult(st) {
  const L = st.last, perfect = L.n1 === L.total && L.n1 > 0;
  const mine = isHost() || !S.my ? "" : S.my.done ? (S.my.resumed ? "Your hit landed." : S.my.first ? "Your hit landed at full power." : "Your hit landed at half power.") : "You didn’t lock in this round. Ask your team for help next time: tap the ✋ button.";
  $("panel").innerHTML = `<h2 class="big-msg">Round ${L.round} team attack</h2>${resultRows(L)}
    <p style="font-weight:800; margin:0">${esc(mine)}</p><p class="note">${perfect ? "Keep it up! Three perfect rounds fire a Time Blast." : "Tip: when you finish, tap a teammate who is still working and help them."}</p>`;
}
function panelOver(st) {
  const L = st.last || {}, won = L.stars > 0, can = canStart(st);
  const stars = won ? `<div class="stars" aria-label="${L.stars} out of 3 stars">${"★".repeat(L.stars)}<span class="off">${"★".repeat(3 - L.stars)}</span></div>` : "";
  S.pickBoss = won ? Math.min(5, st.boss + 1) : st.boss;
  $("panel").innerHTML = `<h2 class="big-msg">${won ? esc(BOSSES[st.boss].name) + " is defeated!" : esc(BOSSES[st.boss].name) + " ran away!"}</h2>${stars}
    <p style="font-weight:800; margin:8px 0 0">${won ? "Your team won in " + L.round + " round" + (L.round === 1 ? "" : "s") + "." + (L.stars < 3 ? " Win in 5 rounds or fewer for 3 stars." : " That’s a 3-star win!") : "It got away after " + MAX_ROUNDS + " rounds. Help each other lock in first time, then try again."}</p>
    ${L.round ? resultRows(L) : ""}
    ${can ? `<h3 style="font-size:22px; margin-top:8px">${isHost() ? "Pick the next monster" : "Pick your team’s next monster"}</h3>${pickerHTML(st, true)}<div class="row"><button class="btn" id="start">Start the battle</button></div>`
          : `<p class="context" id="waitLead" style="margin-top:10px"></p>${pickerHTML(st, false)}`}`;
  wirePicker(st); updatePicker(st);
}

/* ================= go ================= */
(async () => {
  if (save.code && save.key) {
    try { const st = await rpc("raid_state", { p_code: save.code, p_key: save.key }); if (st && st.ok && (save.role === "host" ? st.host : st.you != null)) { room(); apply(st, ++S.seq); startPolling(); return; } } catch (e) {}
    save.code = ""; save.key = ""; save.role = ""; persist();
  }
  home();
})();
</script>
</body>
</html>
