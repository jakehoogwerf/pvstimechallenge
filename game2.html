<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tickwick 2: The Runaway Time Train</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --night:#1A1640; --plum:#5B2A86; --brass:#E8B13B; --brass-dark:#B07F12; --signal:#E5484D; --teal:#1E6F7A;
  --panel:#F7F4FF; --panel-2:#E9E3F7; --ink:#221C45; --muted:#5E5880; --line:#D3CBEA;
  --good:#23A07A; --good-soft:#D7F4EA; --bad:#D9415A; --bad-soft:#FCE3E8;
  --clock-face:#FFFFFF; --clock-ink:#221C45; --page:#1A1640; --title:#5B2A86;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --panel:#262056; --panel-2:#332B6B; --ink:#F4F0FF; --muted:#C2BAE6; --line:#4B4285;
    --good-soft:#18493E; --bad-soft:#4C2236; --page:#110E2C; --title:#D2B4FF; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --panel:#262056; --panel-2:#332B6B; --ink:#F4F0FF; --muted:#C2BAE6; --line:#4B4285;
  --good-soft:#18493E; --bad-soft:#4C2236; --page:#110E2C; --title:#D2B4FF; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px); background:var(--page)}
html,body{margin:0; min-height:100%}
body{
  background:var(--page);
  background-image:radial-gradient(ellipse at 50% -10%, #3A2A7A 0%, transparent 60%);
  color:var(--ink); font-family:"Nunito","Trebuchet MS",Arial,sans-serif; font-size:18px; line-height:1.5;
}
.app{max-width:800px; margin:0 auto; padding:14px 14px 40px}
.display,h1,h2,h3{font-family:"Lilita One","Arial Black",Arial,sans-serif; font-weight:400; letter-spacing:.3px; line-height:1.1; margin:0}
button{font:inherit; cursor:pointer}
button:focus-visible,input:focus-visible{outline:4px solid var(--brass); outline-offset:3px}

/* HUD */
.hud{display:flex; align-items:center; justify-content:space-between; gap:8px; color:#F4F0FF; padding:2px 2px 10px; flex-wrap:wrap}
.brand{font-family:"Lilita One",Arial,sans-serif; font-size:21px; color:var(--brass)}
.pills{display:flex; gap:6px; flex-wrap:wrap; align-items:center}
.pill{display:flex; align-items:center; gap:6px; background:rgba(255,255,255,.12); padding:4px 12px 4px 6px; border-radius:999px; font-weight:900; font-size:17px; color:#F4F0FF; border:none}
.pill[hidden]{display:none}
.pill svg{width:24px; height:24px}
.steam{display:flex; gap:3px; align-items:center}
.steam i{width:12px; height:18px; border-radius:4px; background:rgba(255,255,255,.2); transition:background .2s}
.steam i.on{background:var(--brass)}
.timer{font-variant-numeric:tabular-nums}
.penalty{color:#FFB3C1; margin-left:4px}
.progress{height:8px; background:rgba(255,255,255,.14); border-radius:999px; overflow:hidden; margin:0 2px 10px}
.progress i{display:block; height:100%; background:linear-gradient(90deg,var(--brass),#FFD873); transition:width .3s}

/* stage */
.scene{position:relative; border-radius:24px 24px 0 0; overflow:hidden; line-height:0; box-shadow:0 14px 34px rgba(0,0,0,.4)}
.scene svg{width:100%; height:auto; display:block}
.scene.shake{animation:shake .4s}
.panel{background:var(--panel); border-radius:0 0 24px 24px; padding:22px; position:relative; box-shadow:0 14px 34px rgba(0,0,0,.3)}
.banner{position:absolute; left:50%; top:42%; transform:translate(-50%,-50%) rotate(-4deg); font-family:"Lilita One",Arial,sans-serif; font-size:44px; color:#FFF; text-shadow:0 4px 0 var(--plum),0 0 22px rgba(232,177,59,.9); white-space:nowrap; pointer-events:none; animation:bannerIn 1.3s ease-out forwards; line-height:1}
@keyframes bannerIn{0%{opacity:0; transform:translate(-50%,-50%) scale(.3) rotate(-14deg)}25%{opacity:1; transform:translate(-50%,-50%) scale(1.12) rotate(-4deg)}75%{opacity:1}100%{opacity:0; transform:translate(-50%,-70%) scale(1) rotate(-4deg)}}

/* scene animations */
.spin{transform-box:fill-box; transform-origin:center; animation:spin 1s linear infinite}
.spin.slow{animation-duration:3s}
@keyframes spin{to{transform:rotate(360deg)}}
.puff{transform-box:fill-box; transform-origin:center; animation:puff 2.4s ease-out infinite}
@keyframes puff{0%{transform:translate(0,0) scale(.4); opacity:.95}100%{transform:translate(-40px,-70px) scale(1.7); opacity:0}}
.drift{animation:drift 38s linear infinite}
@keyframes drift{from{transform:translateX(-160px)}to{transform:translateX(800px)}}
.twinkle{animation:tw 1.8s ease-in-out infinite alternate}
@keyframes tw{to{opacity:.25}}
.bob{animation:bob 1.4s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-7px)}}
.rumble{animation:rumble .22s linear infinite}
@keyframes rumble{50%{transform:translateY(1.5px)}}
.flash{animation:flash 6s infinite}
@keyframes flash{0%,90%,100%{opacity:0}91%,94%{opacity:.85}92.5%{opacity:.15}}
.snow{animation:snow linear infinite}
@keyframes snow{from{transform:translateY(-30px)}to{transform:translateY(310px)}}
.glow{animation:glow 1.6s ease-in-out infinite alternate}
@keyframes glow{to{opacity:.45}}
.sleepers{animation:sleepers .5s linear infinite}
@keyframes sleepers{to{transform:translateX(-40px)}}
.blub{transform-box:fill-box; transform-origin:center bottom; animation:blub 1.2s ease-in-out infinite alternate}
@keyframes blub{to{transform:scaleY(1.35)}}
.zoom{transition:transform .9s cubic-bezier(.3,1.4,.5,1)}

/* dialogue */
.dialog{display:flex; gap:16px; align-items:flex-start}
.portrait{flex:0 0 92px; width:92px; height:92px; border-radius:22px; overflow:hidden; border:4px solid var(--brass); background:var(--panel-2)}
.portrait svg{width:100%; height:100%; display:block}
.speaker{font-family:"Lilita One",Arial,sans-serif; font-size:20px; color:var(--title)}
.line{font-size:21px; margin:2px 0 0; max-width:60ch}
.say-in{animation:sayIn .35s ease-out}
@keyframes sayIn{from{opacity:0; transform:translateY(8px)}}
.row{display:flex; gap:10px; justify-content:flex-end; align-items:center; margin-top:18px; flex-wrap:wrap}
.btn{border:none; border-radius:16px; padding:12px 24px; font-weight:900; font-size:19px; background:var(--brass); color:#2A1C00; box-shadow:0 5px 0 var(--brass-dark); transition:transform .08s}
.btn:active{transform:translateY(4px); box-shadow:0 1px 0 var(--brass-dark)}
.btn.ghost{background:var(--panel-2); color:var(--ink); box-shadow:0 5px 0 var(--line)}
.btn.small{padding:8px 14px; font-size:16px}
.btn:disabled{opacity:.5; cursor:not-allowed}
.speak{background:none; border:2px solid var(--line); color:var(--muted); border-radius:12px; padding:6px 10px; font-weight:800; font-size:15px}

/* questions */
.qtop{display:flex; justify-content:space-between; align-items:center; gap:10px; color:var(--muted); font-size:16px; font-weight:800; margin-bottom:6px}
.prompt{font-size:23px; font-weight:900; margin:0 0 4px}
.context{color:var(--muted); font-size:17px; margin:0 0 12px}
.visual{display:flex; justify-content:center; gap:22px; flex-wrap:wrap; margin:8px 0 16px}
.clockwrap{text-align:center}
.clockwrap svg{width:190px; height:190px}
.clockwrap .cap{font-weight:900; margin-top:2px}
.options{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px}
.opt{border:3px solid var(--line); background:var(--panel-2); color:var(--ink); border-radius:18px; padding:14px 10px; font-weight:900; font-size:21px; min-height:64px; transition:transform .1s, border-color .1s}
.opt:hover:not(:disabled){border-color:var(--brass); transform:translateY(-2px)}
.opt.clockopt{padding:8px}
.opt.clockopt svg{width:120px; height:120px; display:block; margin:0 auto}
.opt.wrong{background:var(--bad-soft); border-color:var(--bad); opacity:.7; animation:shake .35s}
.opt.right{background:var(--good-soft); border-color:var(--good); animation:pop .4s}
.opt:disabled{cursor:default}
@keyframes shake{20%{transform:translateX(-7px)}60%{transform:translateX(7px)}}
@keyframes pop{50%{transform:scale(1.07)}}
.feedback{margin-top:14px; border-radius:16px; padding:12px 16px; font-size:18px; display:none}
.feedback.show{display:block; animation:sayIn .25s ease-out}
.feedback.good{background:var(--good-soft); border:2px solid var(--good)}
.feedback.hint{background:var(--bad-soft); border:2px solid var(--bad)}
.nl{overflow-x:auto; margin:4px 0 8px}
.nl svg{width:100%; min-width:400px; height:auto}
.steps{list-style:none; padding:0; margin:0 0 10px}
.steps li{padding:5px 0; color:var(--muted); font-size:17px}
.steps li.done{color:var(--good)}
.steps li.now{color:var(--ink); font-weight:900; font-size:20px}
.tt{border-collapse:separate; border-spacing:0; margin:4px auto 14px; min-width:280px; background:#1C2A3A; color:#FFE9A8; border-radius:14px; overflow:hidden; font-weight:800; box-shadow:inset 0 0 0 4px #33485F}
.tt caption{caption-side:top; font-family:"Lilita One",Arial,sans-serif; color:var(--ink); font-size:19px; padding-bottom:6px}
.tt th{font-size:14px; color:#9FB4CC; text-align:left; padding:10px 16px 4px}
.tt td{padding:7px 16px; border-top:1px dashed #33485F; font-size:19px}
.tt td.time{font-variant-numeric:tabular-nums; text-align:right}
.tt tr.hl td{background:#2E4A63; color:#FFFFFF}
.setter{display:flex; flex-direction:column; align-items:center; gap:10px}
.setter svg{width:230px; height:230px; touch-action:none}
.digital{font-family:"Lilita One",Arial,sans-serif; font-size:32px; background:#1C2A3A; color:#FFE9A8; padding:2px 18px; border-radius:12px; min-width:130px; text-align:center}
.controls{display:grid; grid-template-columns:repeat(4,auto); gap:8px; justify-content:center}
.controls .label{grid-column:1/-1; text-align:center; color:var(--muted); font-size:15px}
.bar{display:flex; align-items:center; gap:12px; margin:0 0 12px}
.bar .mini{flex:0 0 52px; width:52px; height:52px; border-radius:14px; overflow:hidden; border:3px solid var(--signal)}
.bar .mini svg{width:100%; height:100%}
.hp{flex:1; height:20px; background:var(--panel-2); border-radius:999px; overflow:hidden; border:2px solid var(--line)}
.hp i{display:block; height:100%; background:linear-gradient(90deg,var(--signal),#FF8A65); transition:width .5s}
.fuse{height:12px; background:var(--panel-2); border-radius:999px; overflow:hidden; margin:0 0 12px; border:2px solid var(--line)}
.fuse i{display:block; height:100%; background:linear-gradient(90deg,#FFD873,var(--signal)); transition:width .2s linear}
.fuse-label{font-size:15px; font-weight:800; color:var(--muted); margin-bottom:4px}

/* title + map */
.avatars{display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:10px; margin:10px 0 4px}
.av{border:4px solid transparent; background:var(--panel-2); border-radius:20px; padding:4px; position:relative}
.av svg{width:100%; height:auto; display:block; border-radius:14px}
.av[aria-pressed="true"]{border-color:var(--brass); transform:translateY(-3px)}
.av.locked svg{filter:grayscale(1) brightness(.6)}
.av .lock{position:absolute; inset:auto 0 6px 0; text-align:center; font-size:13px; font-weight:900; color:#fff; text-shadow:0 1px 3px #000; line-height:1.2}
.namefield{display:flex; flex-direction:column; gap:6px; margin-top:14px}
.namefield input{font:inherit; font-size:21px; padding:10px 14px; border-radius:14px; border:3px solid var(--line); background:var(--panel-2); color:var(--ink)}
.tickets{display:grid; gap:12px}
.ticket{display:flex; align-items:stretch; width:100%; padding:0; border:none; text-align:left; border-radius:16px; overflow:hidden; background:var(--panel-2); color:var(--ink); box-shadow:0 4px 0 var(--line)}
.ticket .stub{flex:0 0 76px; background:var(--plum); color:#FFE9A8; display:grid; place-items:center; font-family:"Lilita One",Arial,sans-serif; font-size:30px; border-right:4px dotted var(--panel)}
.ticket .body{padding:12px 16px; flex:1}
.ticket .t{font-family:"Lilita One",Arial,sans-serif; font-size:22px}
.ticket .d{color:var(--muted); font-size:16px}
.ticket .done{align-self:center; padding-right:16px; color:var(--good); font-weight:900; font-size:16px; white-space:nowrap}
.ticket.locked{opacity:.5; cursor:not-allowed}
.ticket.locked .stub{background:var(--muted)}
.choice{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.route{border:4px solid var(--line); border-radius:20px; overflow:hidden; padding:0; background:var(--panel-2); color:var(--ink); text-align:left}
.route:hover{border-color:var(--brass)}
.route svg{width:100%; height:auto; display:block}
.route span{display:block; padding:10px 14px; font-family:"Lilita One",Arial,sans-serif; font-size:22px}
.route small{display:block; padding:0 14px 12px; color:var(--muted); font-size:15px; font-family:"Nunito",Arial,sans-serif}
.board{width:100%; border-collapse:collapse; margin-top:10px; font-size:18px}
.board th{text-align:left; color:var(--muted); font-size:15px; padding:6px 8px; border-bottom:2px solid var(--line)}
.board td{padding:8px; border-bottom:1px solid var(--line)}
.board td.n{font-family:"Lilita One",Arial,sans-serif; width:44px}
.board tr.me td{background:var(--good-soft); font-weight:900}
.bigtime{font-family:"Lilita One",Arial,sans-serif; font-size:60px; text-align:center; margin:4px 0; font-variant-numeric:tabular-nums}
.status{color:var(--muted); font-size:16px; margin-top:8px}
.rules{margin:10px 0 0; padding-left:22px}
.ticketcert{text-align:center; border-radius:22px; padding:24px 16px; background:linear-gradient(135deg,#FFE9A8,#E8B13B); color:#2A1C00; border:4px dashed #B07F12}
.ticketcert h2{font-size:36px; color:#5B2A86}
.ticketcert .who{font-family:"Lilita One",Arial,sans-serif; font-size:40px; margin:8px 0}
.ticketcert svg.hero{width:110px; height:110px; border-radius:22px; border:4px solid #5B2A86}

/* confetti */
.confetti{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:20}
.confetti i{position:absolute; width:10px; height:14px; border-radius:2px; animation:fall 1.4s ease-in forwards}
@keyframes fall{from{transform:translateY(0) rotate(0)}to{transform:translateY(105vh) rotate(720deg); opacity:.7}}

@media (max-width:600px){
  body{font-size:17px}
  .options{grid-template-columns:1fr}
  .options.clocks{grid-template-columns:1fr 1fr}
  .opt.clockopt svg{width:100px; height:100px}
  .portrait{flex-basis:64px; width:64px; height:64px; border-radius:16px}
  .line{font-size:19px}
  .clockwrap svg{width:150px; height:150px}
  .avatars{grid-template-columns:repeat(3,minmax(0,1fr))}
  .choice{grid-template-columns:1fr}
  .banner{font-size:32px}
  .brand{font-size:18px}
}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important; transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="hud">
    <div class="brand">Tickwick 2</div>
    <div class="pills">
      <div class="pill" title="Golden cogs"><span id="cogIcon"></span><span id="cogs">0</span></div>
      <div class="pill" title="First-try stars"><span id="starIcon"></span><span id="stars">0</span></div>
      <div class="pill" title="Steam power: 3 right in a row for a boost"><span aria-hidden="true">🚂</span><span class="steam" id="steam"><i></i><i></i><i></i></span></div>
      <div class="pill timer" id="timerPill" title="Speedrun time" hidden><span aria-hidden="true">⏱</span><span id="timer">0:00.0</span><span class="penalty" id="pen"></span></div>
      <button class="pill" id="sound" title="Sound on or off" aria-label="Sound on or off"></button>
    </div>
  </div>
  <div class="progress" id="progressBar" hidden><i id="progressFill" style="width:0%"></i></div>
  <div class="scene" id="scene"></div>
  <div class="panel" id="panel"></div>
</div>
<div class="confetti" id="confetti" aria-hidden="true"></div>

<script>
/* ================= helpers ================= */
const $ = (id) => document.getElementById(id);
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const shuffle = (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const norm = (t) => ((t % 720) + 720) % 720;
const hourOf = (t) => Math.floor(norm(t) / 60) || 12;
const fmt = (t) => hourOf(t) + ":" + String(norm(t) % 60).padStart(2, "0");
function words(t) {
  t = norm(t); const h = hourOf(t), m = t % 60, next = (h % 12) + 1;
  if (m === 0) return h + " o’clock";
  if (m === 15) return "quarter past " + h;
  if (m === 30) return "half past " + h;
  if (m === 45) return "quarter to " + next;
  if (m < 30) return m + " minute" + (m === 1 ? "" : "s") + " past " + h;
  const r = 60 - m; return r + " minute" + (r === 1 ? "" : "s") + " to " + next;
}
function dur(d) { const h = Math.floor(d / 60), m = d % 60, out = []; if (h) out.push(h + " hour" + (h > 1 ? "s" : "")); if (m || !h) out.push(m + " minute" + (m === 1 ? "" : "s")); return out.join(" "); }
function shortDur(d) { const h = Math.floor(d / 60), m = d % 60; return ((h ? h + " h " : "") + (m || !h ? m + " min" : "")).trim(); }
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ================= save ================= */
const SAVE_KEY = "tickwick2-save-v1";
function load() { try { const v = JSON.parse(localStorage.getItem(SAVE_KEY) || "null"); if (v) return v; } catch (e) {} return null; }
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {} }
let state = Object.assign({ name: "", hero: "fox", cogs: 0, stars: 0, done: [], route: "", sound: true, pb: 0 }, load() || {});

/* ================= sound (made in the browser, no files) ================= */
let actx = null;
function tone(freq, dur = 0.15, type = "sine", when = 0, vol = 0.08) {
  if (!state.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain(), t0 = actx.currentTime + when;
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0 + dur + 0.02);
  } catch (e) {}
}
const SFX = {
  right: () => { tone(660, .12, "triangle"); tone(990, .2, "triangle", .1); },
  wrong: () => { tone(220, .22, "square", 0, .04); tone(180, .25, "square", .12, .04); },
  steam: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .16, "triangle", i * .08)),
  hit: () => { tone(140, .18, "sawtooth", 0, .07); tone(90, .3, "sawtooth", .08, .06); },
  whistle: () => { tone(880, .35, "sine", 0, .05); tone(1175, .5, "sine", .05, .04); },
  win: () => [523, 659, 784, 659, 784, 1047].forEach((f, i) => tone(f, .22, "triangle", i * .13)),
  click: () => tone(520, .05, "sine", 0, .04),
};
function drawSound() { $("sound").innerHTML = `<span aria-hidden="true">${state.sound ? "🔊" : "🔇"}</span>`; $("sound").setAttribute("aria-pressed", state.sound ? "true" : "false"); }
$("sound").onclick = () => { state.sound = !state.sound; save(); drawSound(); SFX.click(); };

/* ================= confetti + banner ================= */
const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function confetti(n = 40) {
  if (reduceMotion) return;
  const box = $("confetti"), cols = ["#E8B13B", "#E5484D", "#23A07A", "#7FB3FF", "#C58AF9", "#FFFFFF"];
  for (let i = 0; i < n; i++) {
    const p = document.createElement("i");
    p.style.left = Math.random() * 100 + "vw"; p.style.top = -20 - Math.random() * 80 + "px";
    p.style.background = pick(cols); p.style.animationDelay = Math.random() * .3 + "s"; p.style.animationDuration = 1 + Math.random() * .8 + "s";
    box.appendChild(p); setTimeout(() => p.remove(), 2400);
  }
}
function banner(text) {
  const b = document.createElement("div"); b.className = "banner"; b.textContent = text;
  $("scene").appendChild(b); setTimeout(() => b.remove(), 1400);
}
function shakeScene() { const s = $("scene"); s.classList.remove("shake"); void s.offsetWidth; s.classList.add("shake"); }

/* ================= art ================= */
const ICON_COG = `<svg viewBox="0 0 40 40" aria-hidden="true"><path fill="#E8B13B" stroke="#B07F12" stroke-width="2" d="M17 2h6l1 5 4 2 4-3 4 4-3 4 2 4 5 1v6l-5 1-2 4 3 4-4 4-4-3-4 2-1 5h-6l-1-5-4-2-4 3-4-4 3-4-2-4-5-1v-6l5-1 2-4-3-4 4-4 4 3 4-2z"/><circle cx="20" cy="20" r="6" fill="#1A1640"/></svg>`;

function clockSVG(t, opts = {}) {
  const r = 90, c = 100, mins = norm(t);
  let s = `<svg viewBox="0 0 200 200" role="img" aria-label="${opts.label || "An analogue clock"}">`;
  s += `<circle cx="100" cy="100" r="97" fill="#5B2A86"/><circle cx="100" cy="100" r="${r}" fill="var(--clock-face)" stroke="#E8B13B" stroke-width="4"/>`;
  for (let i = 0; i < 60; i++) {
    const a = i * 6 * Math.PI / 180, big = i % 5 === 0, r1 = r - (big ? 12 : 6), r2 = r - 3;
    s += `<line x1="${c + r1 * Math.sin(a)}" y1="${c - r1 * Math.cos(a)}" x2="${c + r2 * Math.sin(a)}" y2="${c - r2 * Math.cos(a)}" stroke="var(--clock-ink)" stroke-width="${big ? 3 : 1.2}" stroke-linecap="round"/>`;
  }
  for (let n = 1; n <= 12; n++) {
    const a = n * 30 * Math.PI / 180, rr = r - 25;
    s += `<text x="${c + rr * Math.sin(a)}" y="${c - rr * Math.cos(a) + 6}" font-family="Nunito, Arial, sans-serif" font-weight="900" font-size="18" text-anchor="middle" fill="var(--clock-ink)">${n}</text>`;
  }
  const ha = (mins / 720) * 2 * Math.PI, ma = (mins % 60) * 6 * Math.PI / 180;
  s += `<line x1="100" y1="100" x2="${c + r * .5 * Math.sin(ha)}" y2="${c - r * .5 * Math.cos(ha)}" stroke="var(--clock-ink)" stroke-width="8" stroke-linecap="round"/>`;
  s += `<line x1="100" y1="100" x2="${c + r * .8 * Math.sin(ma)}" y2="${c - r * .8 * Math.cos(ma)}" stroke="var(--clock-ink)" stroke-width="4.5" stroke-linecap="round"/>`;
  return s + `<circle cx="100" cy="100" r="6" fill="#E8B13B" stroke="var(--clock-ink)" stroke-width="2"/></svg>`;
}

function numberLine(stops, jumps, back = false) {
  const W = 640, H = 170, X0 = 56, X1 = 584, Y = 120, n = stops.length - 1, xs = stops.map((_, i) => X0 + (X1 - X0) * i / n);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Number line from ${stops[0]} to ${stops[n]}"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#E8B13B"/></marker></defs>`;
  s += `<line x1="${X0 - 24}" y1="${Y}" x2="${X1 + 24}" y2="${Y}" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>`;
  xs.forEach((x, i) => {
    s += `<line x1="${x}" y1="${Y - 11}" x2="${x}" y2="${Y + 11}" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>`;
    s += `<text x="${x}" y="${Y + 40}" text-anchor="middle" font-family="Nunito, Arial, sans-serif" font-weight="900" font-size="23" fill="var(--ink)">${stops[i]}</text>`;
  });
  jumps.forEach((lbl, i) => {
    const a = xs[i] + 8, b = xs[i + 1] - 8, [p, q] = back ? [b, a] : [a, b], shown = lbl !== null;
    s += `<path d="M${p},${Y - 14} C${p},${Y - 82} ${q},${Y - 82} ${q},${Y - 16}" fill="none" stroke="${shown ? "#E8B13B" : "var(--line)"}" stroke-width="5" ${shown ? "" : 'stroke-dasharray="8 7"'} marker-end="url(#ar)"/>`;
    s += `<text x="${(xs[i] + xs[i + 1]) / 2}" y="${Y - 80}" text-anchor="middle" font-family="Nunito, Arial, sans-serif" font-weight="900" font-size="22" fill="${shown ? "var(--ink)" : "var(--muted)"}">${shown ? lbl : "?"}</text>`;
  });
  return s + `</svg>`;
}

function grad(id, top, bottom) { return `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${top}"/><stop offset="1" stop-color="${bottom}"/></linearGradient></defs><rect width="640" height="300" fill="url(#${id})"/>`; }
function cloud(x, y, s, dur, delay) { return `<g class="drift" style="animation-duration:${dur}s; animation-delay:${delay}s"><g transform="translate(${x} ${y}) scale(${s})" fill="#FFFFFF" opacity=".85"><ellipse cx="0" cy="0" rx="34" ry="14"/><ellipse cx="22" cy="-8" rx="22" ry="14"/><ellipse cx="-18" cy="-6" rx="18" ry="11"/></g></g>`; }
function track(y, moving = true) {
  let s = `<rect x="0" y="${y}" width="640" height="10" fill="#5A4A3A"/>`;
  s += `<g class="${moving ? "sleepers" : ""}">`; for (let x = -40; x < 700; x += 40) s += `<rect x="${x}" y="${y - 2}" width="18" height="14" rx="2" fill="#7A5E44"/>`; s += `</g>`;
  return s + `<rect x="0" y="${y - 4}" width="640" height="4" fill="#B9BCD0"/>`;
}
function train(x, y, color = "#5B2A86", rider = "", moving = true) {

  const puffs = moving ? [0, .8, 1.6].map((d) => `<circle class="puff" style="animation-delay:${d}s" cx="${x + 132}" cy="${y - 18}" r="12" fill="#F4F0FF"/>`).join("") : "";
  return `<g>${puffs}<g class="${moving ? "rumble" : ""}">
    <rect x="${x}" y="${y}" width="74" height="44" rx="6" fill="${color}"/><rect x="${x + 10}" y="${y + 8}" width="22" height="18" rx="3" fill="#FFE9A8"/><rect x="${x + 40}" y="${y + 8}" width="22" height="18" rx="3" fill="#FFE9A8"/>

}

function timeOptions(t, extra = []) {

}
const swappedTime = (t) => { const h = hourOf(t), m = t % 60, n = Math.round(m / 5) % 12 || 12; return n * 60 + (h % 12) * 5; };

const naiveAdd = (t, d) => hourOf(t) + Math.floor(d / 60) + ":" + String((t % 60) + (d % 60)).padStart(2, "0");

function crossing(step, minD, maxD, minH = 1, maxH = 8) { for (;;) { const a = startTime(step, minH, maxH); let d = rnd(minD, maxD); if (step === 5) d = Math.round(d / 5) * 5; const to = 60 - (a % 60); if (d > to && (d - to) % 60 !== 0) return [a, d]; } }

function qRead(t, context) {
  return { type: "mc", prompt: "What time does this clock show?", context, visual: `<div class="clockwrap">${clockSVG(t)}</div>`, options: timeOptions(t, [swappedRead(t)]), answer: fmt(t),
    hint: t % 60 >= 30 ? "The short hand has passed " + hourOf(t) + " but not reached " + (hourOf(t) % 12 + 1) + ". Count the minutes in 5s, then 1s." : "Find the hour with the short hand. Count in 5s to the last big number, then count on the little marks in 1s.",
    explain: "It’s " + fmt(t) + ", or " + words(t) + "." };
}
function qPick(t, context) {

  return { type: "pick", prompt: "Which clock shows " + fmt(t) + "?", context, times: shuffle([...times]), answer: fmt(t),
    hint: "Check the long hand first: " + (t % 60) + " minutes. Then check the short hand is near the " + hourOf(t) + ".",
    explain: "That clock shows " + fmt(t) + ", " + words(t) + "." };
}
function qWords(t, context) {

  if (m > 30) { wrong.add((60 - m) + " minutes to " + h); wrong.add((60 - m) + " minutes past " + h); } else { wrong.add(m + " minutes to " + h); wrong.add(m + " minutes past " + next); }
  wrong.add(words(t + 5)); wrong.add(words(t - 60));

    hint: m > 30 ? "The long hand is on the left side, so we say “to”. Do 60 − " + m + "." : "The long hand is on the right side, so we say “past”.", explain: fmt(t) + " is " + words(t) + "." };

function qFinishMC(a, d, context, clock) {

    const face = HEROES[r.hero] ? `<span style="display:inline-block; width:28px; height:28px; vertical-align:middle; margin-right:6px; border-radius:8px; overflow:hidden">${heroSVG(r.hero)}</span>` : "";
    return `<tr class="${me ? "me" : ""}"><td class="n">${i + 1}</td><td>${face}${esc(r.player)}</td><td>${wholeTxt(r.time_seconds)}</td><td>${accuracy(r.wrong_answers)}%</td></tr>`;
  }).join("")}</tbody></table></div>`;
}
async function fillBoard(el, mine) {
  el.innerHTML = `<p class="status">Loading the class leaderboard…</p>`;
  try { el.innerHTML = boardHTML(await topTen(), mine); } catch (e) { el.innerHTML = `<p class="status">The class leaderboard didn’t load. Check the internet connection and try again.</p>`; }
}
function leaderboardScreen() {
  progress(null); setScene("bridge", 1);
  $("panel").innerHTML = `<h2 style="font-size:30px">Class speedrun leaderboard</h2>${state.pb ? `<p class="context">Your personal best on this device: <b>${wholeTxt(state.pb)}</b></p>` : ""}<div id="board"></div><div class="row"><button class="btn ghost" id="map">Back to the map</button></div>`;
  $("map").onclick = mapScreen; fillBoard($("board"));
}
function speedrunIntro() {
  progress(null); setScene("bridge", .5);
  const total = SPEED_ORDER.reduce((n, k) => n + CH[k].make().length, 0);
  $("panel").innerHTML = `<div class="dialog"><div class="portrait">${PORTRAITS["Count Cuckoo"]}</div><div><div class="speaker">Count Cuckoo</div><p class="line">Cuckoo! A race? Ride the whole line as fast as you can!</p></div></div>
    <ul class="rules"><li>${total} questions from every stop, one after another.</li><li>The clock only runs while you’re answering.</li><li>Every wrong answer adds ${PENALTY_S} seconds, so don’t guess!</li></ul>
    <div class="row"><button class="btn ghost" id="map">Back</button><button class="btn" id="go">Start the clock</button></div>`;
  $("map").onclick = mapScreen;
  $("go").onclick = () => {
    const qs = [], chs = []; SPEED_ORDER.forEach((k) => CH[k].make().forEach((q) => { qs.push(q); chs.push(k); }));
    run = { qs, chs, q: 0, streak: 0, hp: qs.length, speed: { ms: 0, since: 0, pen: 0 } };
    SFX.whistle(); showTimer(true); drawTimer(); question();
  };
}
function finishSpeedrun() {
  tickStop(); showTimer(false);
  const exact = speedTotal(), secs = Math.round(exact), pen = run.speed.pen, isPB = !state.pb || secs < state.pb;
  if (isPB) state.pb = secs; save(); progress(1); setScene("finale"); SFX.win(); confetti(80);
  const ok = secs >= 60 && secs <= 7200;
  $("panel").innerHTML = `<h2 style="font-size:30px; text-align:center">Speedrun complete!</h2><div class="bigtime">${clockTxt(exact)}</div>
    <p class="context" style="text-align:center"><b>${accuracy(pen)}% accuracy</b>, ${pen} wrong answer${pen === 1 ? "" : "s"} (+${pen * PENALTY_S} seconds). ${isPB ? "New personal best!" : "Personal best: " + wholeTxt(state.pb)}</p>
    ${ok ? `<div class="namefield"><label for="lbname"><b>Name for the leaderboard (first name or nickname)</b></label><input id="lbname" maxlength="20" autocomplete="off" value="${esc(state.name)}"></div><div class="row"><button class="btn" id="send">Add my time</button></div>` : `<p class="status">This time can’t go on the class leaderboard.</p>`}
    <div id="board"></div><div class="row"><button class="btn ghost" id="map">Back to the map</button><button class="btn ghost" id="again">Try again</button></div>`;
  $("map").onclick = mapScreen; $("again").onclick = speedrunIntro;
  if ($("send")) {
    $("send").onclick = async () => {
      const player = $("lbname").value.trim().slice(0, 20); if (!player) { $("lbname").focus(); return; }
      $("send").disabled = true; $("send").textContent = "Sending…";
      try { await sendRun({ player, hero: state.hero, time_seconds: secs, wrong_answers: pen }); $("send").textContent = "Time added ✓"; $("lbname").disabled = true; fillBoard($("board"), { player, time_seconds: secs }); }
      catch (e) { $("send").disabled = false; $("send").textContent = "Try again"; $("board").innerHTML = `<p class="status">Your time didn’t send. Check the internet connection and press Try again.</p>`; }
    };
  } else fillBoard($("board"));
}

hud();
titleScreen();
</script>
