<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Tickwick teacher dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --page:#EEEAF8; --card:#FFFFFF; --ink:#221C45; --muted:#5E5880; --line:#DDD6F0; --soft:#F5F2FC;
  --plum:#5B2A86; --brass:#E8B13B; --brass-dark:#B07F12; --good:#1F9A72; --mid:#D08A12; --bad:#D9415A;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page:#141130; --card:#221D4A; --ink:#F2EEFF; --muted:#BDB5E2; --line:#3A3370; --soft:#2B2559; --plum:#C9A8FF; color-scheme:dark}}
:root[data-theme="dark"]{--page:#141130; --card:#221D4A; --ink:#F2EEFF; --muted:#BDB5E2; --line:#3A3370; --soft:#2B2559; --plum:#C9A8FF; color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--page); scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0; min-height:100%}
body{background:var(--page); color:var(--ink); font-family:"Nunito","Trebuchet MS",Arial,sans-serif; font-size:16px; line-height:1.45}
.wrap{max-width:1120px; margin:0 auto; padding:20px 16px 48px}
h1,h2{font-family:"Lilita One","Arial Black",Arial,sans-serif; font-weight:400; margin:0; line-height:1.1}
h1{font-size:30px; color:var(--plum)}
h2{font-size:22px; margin-bottom:12px}
button,select,input{font:inherit}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--brass); outline-offset:2px}
.btn{border:none; border-radius:12px; padding:9px 16px; font-weight:900; background:var(--brass); color:#2A1C00; box-shadow:0 3px 0 var(--brass-dark); cursor:pointer}
.btn.ghost{background:var(--soft); color:var(--ink); box-shadow:0 3px 0 var(--line)}
.card{background:var(--card); border-radius:18px; padding:18px; box-shadow:0 2px 0 var(--line)}
/* login */
.login{max-width:380px; margin:12vh auto 0; text-align:center}
.login p{color:var(--muted)}
.login input{width:100%; font-size:28px; letter-spacing:8px; text-align:center; padding:10px; border-radius:14px; border:3px solid var(--line); background:var(--soft); color:var(--ink); margin:10px 0 14px}
.err{color:var(--bad); font-weight:800; min-height:1.4em}
/* dashboard */
.top{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px}
.filters{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end}
.filters label{display:flex; flex-direction:column; font-size:13px; font-weight:800; color:var(--muted); gap:3px}
.filters select{padding:7px 10px; border-radius:10px; border:2px solid var(--line); background:var(--card); color:var(--ink); font-weight:800; min-width:130px}
.stats{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-bottom:14px}
.stat .v{font-family:"Lilita One",Arial,sans-serif; font-size:34px; line-height:1}
.stat .l{color:var(--muted); font-weight:800; font-size:14px; margin-top:4px}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px}
.skill{display:grid; grid-template-columns:190px 1fr 70px; gap:10px; align-items:center; padding:6px 0}
.skill .name{font-weight:800}
.track{height:16px; background:var(--soft); border-radius:999px; overflow:hidden}
.track i{display:block; height:100%; border-radius:999px}
.skill .pct{text-align:right; font-weight:900; font-variant-numeric:tabular-nums}
.skill .n{grid-column:2/4; color:var(--muted); font-size:13px; margin-top:-6px}
.mist{border-top:1px solid var(--line); padding:10px 0}
.mist:first-of-type{border-top:none}
.mist .h{display:flex; justify-content:space-between; gap:10px; font-weight:900}
.mist .c{font-variant-numeric:tabular-nums; color:var(--bad)}
.mist p{margin:3px 0 0; color:var(--muted); font-size:15px}
.mist .who{font-size:13px; color:var(--muted); margin-top:3px}
.tablewrap{overflow-x:auto}
table{width:100%; border-collapse:collapse}
th{text-align:left; font-size:13px; color:var(--muted); padding:7px 8px; border-bottom:2px solid var(--line); white-space:nowrap; cursor:default}
th.sort{cursor:pointer}
td{padding:8px; border-bottom:1px solid var(--line); vertical-align:top}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--soft)}
.pill{display:inline-block; padding:1px 9px; border-radius:999px; font-weight:900; font-size:14px; color:#fff}
.lvl-good{background:var(--good)} .lvl-mid{background:var(--mid)} .lvl-bad{background:var(--bad)}
.given{color:var(--bad); font-weight:900}
.right{color:var(--good); font-weight:900}
.q{max-width:420px}
.empty{color:var(--muted)}
.note{color:var(--muted); font-size:14px; margin:8px 0 0}
.studentbar{display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap}
@media (max-width:820px){.stats{grid-template-columns:1fr 1fr} .grid2{grid-template-columns:1fr} .skill{grid-template-columns:110px 1fr 56px}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const SUPABASE_URL = "https://awxmgiindzlwtgoxtxdt.supabase.co";
const SUPABASE_KEY = "sb_publishable_9YTsc1bf-_IZKj-KdmQVfg_uOhr997p";
const CHAPTERS = {
  1: { town: "The Frozen Town", market: "The Market of Lost Minutes", river: "The Tick River Ferry", tower: "Grimsby’s Tower" },
  2: { station: "All Aboard!", junction: "Timetable Trouble", route: "Volcano or Frosty", bridge: "The Lightning Bridge", castle: "Count Cuckoo’s Castle" },
  3: { boss1: "The Minute Muncher", boss2: "The O’Clock Ogre", boss3: "The Two-Headed Hydra", boss4: "Triclockatops", boss5: "The Clockwork King" },
};
const SKILL_ORDER = ["Reading clocks", "Past and to", "Setting clocks", "Elapsed time", "Step 1: Same hour", "Step 2: To the o’clock", "Step 3: Across the o’clock", "Step 4: With whole hours", "Timetables", "Finish times", "Start times", "Other"];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const mmss = (t) => t == null ? "–" : Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0");
const key = (n) => String(n || "").trim().toLowerCase();
const pct = (a, b) => b ? Math.round(a / b * 100) : null;
const lvl = (p) => p == null ? "" : p >= 85 ? "lvl-good" : p >= 70 ? "lvl-mid" : "lvl-bad";
const col = (p) => p >= 85 ? "var(--good)" : p >= 70 ? "var(--mid)" : "var(--bad)";

let DATA = null, PIN = "";
const F = { game: "all", period: "all", student: "all", sortBy: "acc", showWrong: 40 };

/* ---------- login ---------- */
function loginScreen(msg = "") {
  DATA = null; PIN = "";
  $("app").innerHTML = `<div class="card login"><h1>Teacher dashboard</h1><p>Enter your password to see class results.</p>
    <form id="f" autocomplete="off"><label for="pin" style="position:absolute; left:-9999px">Password</label><input id="pin" type="password" inputmode="numeric" autocomplete="off" required>
    <div class="err" id="err">${esc(msg)}</div><button class="btn" style="width:100%">Open dashboard</button></form>
    <p style="font-size:14px; margin-top:16px"><a href="index.html" style="color:var(--plum)">Back to the games</a></p></div>`;
  $("pin").focus();
  $("f").onsubmit = async (e) => { e.preventDefault(); $("err").textContent = "Checking…"; await load($("pin").value.trim()); };
}
async function load(pin) {
  try {
    const res = await fetch(SUPABASE_URL + "/rest/v1/rpc/teacher_data", { method: "POST", headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" }, body: JSON.stringify({ pin }) });
    if (!res.ok) throw new Error("status " + res.status);
    const d = await res.json();
    if (d && d.locked) return loginScreen("Too many wrong tries. Wait 15 minutes, then try again.");
    if (!d || !d.ok) return loginScreen("That password isn’t right.");
    PIN = pin; DATA = d; render();
  } catch (e) { loginScreen("Couldn’t reach the results database. Check the internet connection, and that the setup SQL has been run."); }
}

/* ---------- mistake analysis ---------- */
function parseTime(s) { const m = /^(\d{1,2}):(\d{2})$/.exec(String(s).trim()); if (!m) return null; return { h: +m[1] % 12, m: +m[2], v: (+m[1] % 12) * 60 + +m[2] }; }
function parseDur(s) { s = String(s); if (!/minute|hour/.test(s)) return null; const h = /(\d+) hour/.exec(s), m = /(\d+) minute/.exec(s); return (h ? +h[1] * 60 : 0) + (m ? +m[1] : 0); }
const TIPS = {
  "Mixed up the hour and minute hands": "Students read the short hand as minutes. Practise naming each hand before reading: short hand = hour, long hand = minutes.",
  "Hour off by one": "Usually happens when the minute hand is past 30 and the hour hand is nearly on the next number. Stress: the hour is the number the short hand has passed, not the one it’s closest to.",
  "Minutes off by 5 or 10": "A slip while counting in 5s around the clock. Chant the 5s together and point to each number.",
  "Minutes off by 1 to 4": "Miscounting the little minute marks after the last 5. Count on in 1s with a finger on each mark.",
  "Didn’t swap 60 minutes for 1 hour": "They added minutes past 60 (e.g. 3:85). Revisit: when the minutes reach 60, swap them for 1 hour.",
  "Mixed up “past” and “to”": "Revisit the right half (past) and left half (to) of the clock, and that “to” means minutes until the next hour.",
  "Wrong hour in words": "With “to” times, the hour is the next hour (7:40 is 20 to 8, not 20 to 7).",
  "Duration off by one hour": "They lost or added a whole hour, often when the time crossed an o’clock. Model the number line jump to the o’clock.",
  "Duration off by 5 or 10 minutes": "A small counting slip. Check the jump to the o’clock: it’s 60 minus the minutes.",
  "Jump to the o’clock miscounted": "The first jump to the next o’clock is wrong. Practise 60 − minutes (from 9:40, 60 − 40 = 20).",
  "Took away the hours and minutes separately": "They treated it like an ordinary subtraction (4 − 3 hours, then 40 − 15 minutes). Model the jump to the o’clock on a number line and ask: can it really be more than an hour?",
  "Counted up to 100 instead of 60": "They treated an hour as 100 minutes. Revisit the big idea: time counts to 60, and practise the friends of 60.",
  "Other": "Mixed errors. Look at these questions one by one below.",
};
function mistakeType(r) {
  const g = r.given_answer, c = r.correct_answer, sk = r.skill;
  if (sk === "Past and to") {
    const gp = /past/.test(g), cp = /past/.test(c), gt = /to\b/.test(g.replace(/past/, "")), ct = /\bto\b/.test(c);
    if ((gp && ct) || (gt && cp)) return "Mixed up “past” and “to”";
    const gn = (g.match(/\d+/g) || []), cn = (c.match(/\d+/g) || []);
    if (gn[0] === cn[0] && gn[1] !== cn[1]) return "Wrong hour in words";
    return "Minutes off by 5 or 10";
  }
  const tg = parseTime(g), tc = parseTime(c);
  if (/^\d{1,2}:\d{2}$/.test(g) && +g.split(":")[1] >= 60) return "Didn’t swap 60 minutes for 1 hour";
  if (tg && tc) {
    if (tg.m === (tc.h % 12) * 5 && Math.abs(Math.round(tc.m / 5) % 12 - tg.h % 12) <= 0 && tg.v !== tc.v) return "Mixed up the hour and minute hands";
    let d = ((tg.v - tc.v) % 720 + 720) % 720; if (d > 360) d -= 720;
    if (Math.abs(d) === 60) return "Hour off by one";
    if (Math.abs(d) === 5 || Math.abs(d) === 10) return "Minutes off by 5 or 10";
    if (Math.abs(d) < 5) return "Minutes off by 1 to 4";
    return "Other";
  }
  const dg = parseDur(g), dc = parseDur(c);
  if (dg != null && dc != null) {
    if (/hour/.test(g) && +((/(\d+) minute/.exec(g) || [0, 0])[1]) >= 60) return "Didn’t swap 60 minutes for 1 hour";
    const qm = /from (\d{1,2}):(\d{2}) to (\d{1,2}):(\d{2})/.exec(r.question);
    if (qm) {
      const m1 = +qm[2], m2 = +qm[4], dh = ((+qm[3] % 12) - (+qm[1] % 12) + 12) % 12, nv = Math.abs(m2 - m1);
      if (m2 === 0 && dg === 100 - m1) return "Counted up to 100 instead of 60";
      if (m2 < m1 && m2 > 0 && (dg === nv || dg === dh * 60 + nv)) return "Took away the hours and minutes separately";
    }
    if (sk === "Step 2: To the o’clock") return "Jump to the o’clock miscounted";
    if (/Step \d: (Jump (back )?to the o’clock|How many minutes from)/.test(r.question)) return "Jump to the o’clock miscounted";
    const d = dg - dc;
    if (Math.abs(d) === 60) return "Duration off by one hour";
    if (Math.abs(d) === 5 || Math.abs(d) === 10) return "Duration off by 5 or 10 minutes";
    return "Other";
  }
  return "Other";
}

/* ---------- filtering ---------- */
function inPeriod(ts) {
  if (F.period === "all") return true;
  const t = new Date(ts), now = new Date();
  if (F.period === "today") return t.toDateString() === now.toDateString();
  return now - t <= (F.period === "7" ? 7 : 30) * 864e5;
}
function rows() {
  return (DATA.answers || []).filter((r) => (F.game === "all" || String(r.game) === F.game) && inPeriod(r.created_at) && (F.student === "all" || key(r.player) === F.student));
}

/* ---------- render ---------- */
function render() {
  const all = DATA.answers || [];
  const names = [...new Map(all.map((r) => [key(r.player), r.player])).entries()].sort((a, b) => a[1].localeCompare(b[1]));
  const R = rows(), wrong = R.filter((r) => !r.is_correct), right = R.length - wrong.length;
  const studentsN = new Set(R.map((r) => key(r.player))).size;

  // skills
  const sk = {}; for (const r of R) { const s = sk[r.skill] || (sk[r.skill] = { n: 0, ok: 0 }); s.n++; if (r.is_correct) s.ok++; }
  const skillHTML = [...SKILL_ORDER.filter((s) => sk[s]), ...Object.keys(sk).filter((s) => !SKILL_ORDER.includes(s))].map((s) => { const p = pct(sk[s].ok, sk[s].n);
    return `<div class="skill"><span class="name">${s}</span><span class="track"><i style="width:${p}%; background:${col(p)}"></i></span><span class="pct">${p}%</span><span class="n">${sk[s].n} answers, ${sk[s].n - sk[s].ok} wrong</span></div>`; }).join("") || `<p class="empty">No answers yet for this filter.</p>`;

  // mistakes
  const mt = {}; for (const r of wrong) { const t = mistakeType(r); const m = mt[t] || (mt[t] = { n: 0, who: new Map() }); m.n++; m.who.set(key(r.player), (m.who.get(key(r.player)) || 0) + 1); }
  const pname = (k) => (names.find((x) => x[0] === k) || [k, k])[1];
  const mistHTML = Object.entries(mt).sort((a, b) => b[1].n - a[1].n).map(([t, m]) => {
    const top = [...m.who.entries()].sort((a, b) => b[1] - a[1]).slice(0, 5).map(([k, n]) => `${esc(pname(k))} (${n})`).join(", ");
    return `<div class="mist"><div class="h"><span>${esc(t)}</span><span class="c">${m.n}</span></div><p>${esc(TIPS[t] || "")}</p>${F.student === "all" ? `<div class="who">Most often: ${top}</div>` : ""}</div>`;
  }).join("") || `<p class="empty">No wrong answers for this filter. 🎉</p>`;

  // students
  const st = {};
  for (const r of (DATA.answers || []).filter((r) => (F.game === "all" || String(r.game) === F.game) && inPeriod(r.created_at))) {
    const k = key(r.player), s = st[k] || (st[k] = { name: r.player, n: 0, ok: 0, skills: {}, last: r.created_at });
    s.n++; if (r.is_correct) s.ok++; const ss = s.skills[r.skill] || (s.skills[r.skill] = { n: 0, ok: 0 }); ss.n++; if (r.is_correct) ss.ok++;
    if (r.created_at > s.last) s.last = r.created_at;
  }
  const chDone = {}; for (const c of DATA.chapters || []) { if (F.game !== "all" && String(c.game) !== F.game) continue; const k = key(c.player); (chDone[k] || (chDone[k] = new Set())).add(c.game + ":" + c.chapter); }
  const bestJ = (list, k) => { const t = (list || []).filter((r) => key(r.player) === k).map((r) => r.time_seconds); return t.length ? Math.min(...t) : null; };
  const studs = Object.entries(st).map(([k, s]) => {
    const weak = Object.entries(s.skills).filter(([, v]) => v.n >= 3).map(([name, v]) => [name, pct(v.ok, v.n)]).sort((a, b) => a[1] - b[1])[0];
    return { k, ...s, acc: pct(s.ok, s.n), weak, ch: chDone[k] ? chDone[k].size : 0, j1: bestJ(DATA.journeys1, k), j2: bestJ(DATA.journeys2, k) };
  });
  const sorters = { acc: (a, b) => a.acc - b.acc, name: (a, b) => a.name.localeCompare(b.name), n: (a, b) => b.n - a.n, last: (a, b) => b.last.localeCompare(a.last) };
  studs.sort(sorters[F.sortBy]);
  const chTotal = F.game === "1" ? 4 : F.game === "2" ? 5 : 9;
  const studHTML = studs.length ? `<div class="tablewrap"><table><thead><tr><th class="sort" data-sort="name">Student</th><th class="sort" data-sort="n">Answers</th><th class="sort" data-sort="acc">Accuracy ▲</th><th>Weakest skill</th><th>Chapters done</th><th>Adv. 1 time</th><th>Adv. 2 time</th><th class="sort" data-sort="last">Last played</th></tr></thead><tbody>
    ${studs.map((s) => `<tr class="click" data-student="${esc(s.k)}"><td><b>${esc(s.name)}</b></td><td>${s.n}</td><td><span class="pill ${lvl(s.acc)}">${s.acc}%</span></td><td>${s.weak ? esc(s.weak[0]) + " (" + s.weak[1] + "%)" : "–"}</td><td>${F.game === "3" ? "–" : s.ch + " / " + chTotal}</td><td>${mmss(s.j1)}</td><td>${mmss(s.j2)}</td><td>${new Date(s.last).toLocaleDateString(undefined, { day: "numeric", month: "short" })}</td></tr>`).join("")}</tbody></table></div>
    <p class="note">Click a student to see only their results. Accuracy = right answers ÷ all tries.</p>` : `<p class="empty">No students yet for this filter.</p>`;

  // wrong answers list
  const W = wrong.slice().sort((a, b) => b.created_at.localeCompare(a.created_at));
  const wrongHTML = W.length ? `<div class="tablewrap"><table><thead><tr><th>When</th><th>Student</th><th>Skill</th><th>Question</th><th>Their answer</th><th>Correct</th></tr></thead><tbody>
    ${W.slice(0, F.showWrong).map((r) => `<tr><td style="white-space:nowrap">${new Date(r.created_at).toLocaleString(undefined, { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" })}</td><td>${esc(r.player)}</td><td>${esc(r.skill)}<br><span class="note" style="margin:0">${esc(CHAPTERS[r.game]?.[r.chapter] || r.chapter)}</span></td><td class="q">${esc(r.question)}</td><td class="given">${esc(r.given_answer)}</td><td class="right">${esc(r.correct_answer)}</td></tr>`).join("")}</tbody></table></div>
    ${W.length > F.showWrong ? `<div style="margin-top:10px"><button class="btn ghost" id="more">Show more (${W.length - F.showWrong} left)</button></div>` : ""}` : `<p class="empty">No wrong answers for this filter.</p>`;

  const opt = (v, label, cur) => `<option value="${esc(v)}" ${v === cur ? "selected" : ""}>${esc(label)}</option>`;
  $("app").innerHTML = `<div class="top"><h1>Teacher dashboard</h1>
      <div class="filters">
        <label>Adventure<select id="fg">${opt("all", "Both", F.game)}${opt("1", "1: Clocktower", F.game)}${opt("2", "2: Time Train", F.game)}${opt("3", "3: Monster Raid", F.game)}</select></label>
        <label>When<select id="fp">${opt("today", "Today", F.period)}${opt("7", "Last 7 days", F.period)}${opt("30", "Last 30 days", F.period)}${opt("all", "All time", F.period)}</select></label>
        <label>Student<select id="fs">${opt("all", "Whole class", F.student)}${names.map(([k, n]) => opt(k, n, F.student)).join("")}</select></label>
        <button class="btn ghost" id="refresh">Refresh</button><button class="btn ghost" id="csv">Download CSV</button><button class="btn" id="lock">Lock</button>
      </div></div>
    ${F.student !== "all" ? `<div class="studentbar"><h2 style="margin:0">${esc(pname(F.student))}</h2><button class="btn ghost" id="clear">Show whole class</button></div>` : ""}
    <div class="stats">
      <div class="card stat"><div class="v">${F.student === "all" ? studentsN : 1}</div><div class="l">${F.student === "all" ? "Students who played" : "Student"}</div></div>
      <div class="card stat"><div class="v">${R.length}</div><div class="l">Answers given</div></div>
      <div class="card stat"><div class="v" style="color:${R.length ? col(pct(right, R.length)) : "inherit"}">${R.length ? pct(right, R.length) + "%" : "–"}</div><div class="l">Accuracy</div></div>
      <div class="card stat"><div class="v">${wrong.length}</div><div class="l">Wrong answers</div></div>
    </div>
    <div class="grid2"><div class="card"><h2>Skills</h2>${skillHTML}</div><div class="card"><h2>Common mistakes</h2>${mistHTML}</div></div>
    ${F.student === "all" ? `<div class="card" style="margin-bottom:14px"><h2>Students</h2>${studHTML}</div>` : ""}
    <div class="card"><h2>Wrong answers</h2>${wrongHTML}</div>`;

  $("fg").onchange = (e) => { F.game = e.target.value; render(); };
  $("fp").onchange = (e) => { F.period = e.target.value; render(); };
  $("fs").onchange = (e) => { F.student = e.target.value; F.showWrong = 40; render(); };
  $("refresh").onclick = () => load(PIN);
  $("lock").onclick = () => loginScreen();
  $("csv").onclick = () => downloadCSV(R);
  if ($("clear")) $("clear").onclick = () => { F.student = "all"; render(); };
  if ($("more")) $("more").onclick = () => { F.showWrong += 60; render(); };
  document.querySelectorAll("[data-sort]").forEach((th) => th.onclick = () => { F.sortBy = th.dataset.sort; render(); });
  document.querySelectorAll("[data-student]").forEach((tr) => tr.onclick = () => { F.student = tr.dataset.student; F.showWrong = 40; render(); window.scrollTo(0, 0); });
}

function downloadCSV(list) {
  const cols = ["created_at", "player", "game", "chapter", "skill", "question", "given_answer", "correct_answer", "is_correct"];
  const q = (v) => '"' + String(v ?? "").replace(/"/g, '""') + '"';
  const csv = [cols.join(","), ...list.map((r) => cols.map((c) => q(c === "chapter" ? (CHAPTERS[r.game]?.[r.chapter] || r.chapter) : r[c])).join(","))].join("\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
  a.download = "tickwick-answers.csv"; document.body.appendChild(a); a.click(); a.remove();
}

loginScreen();
</script>
